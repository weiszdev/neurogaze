<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroGaze 30-Point Strategic Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060a14;
  --surface: #0d1424;
  --surface-hover: #131d33;
  --border: rgba(0, 229, 255, 0.12);
  --cyan: #00e5ff;
  --violet: #7c3aed;
  --amber: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --font-head: 'Syne', sans-serif;
  --font-mono: 'Space Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 20px;
  position: relative;
  z-index: 1;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 32px;
}

.header h1 {
  font-family: var(--font-head);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.header .subtitle {
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* STATS BAR */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.stat-item {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.stat-item span {
  font-weight: 700;
  color: var(--cyan);
}

/* CONTROLS */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 28px;
  align-items: center;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-group label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
}

.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover { border-color: var(--cyan); color: var(--text); }
.btn.active { background: rgba(0,229,255,0.1); border-color: var(--cyan); color: var(--cyan); }

/* CARD GRID */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

/* CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,229,255,0.08);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.card-number {
  font-family: var(--font-head);
  font-size: 0.7rem;
  color: var(--text-muted);
  opacity: 0.6;
}

.card-title {
  font-family: var(--font-head);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  line-height: 1.3;
}

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-children { background: rgba(124,58,237,0.2); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
.badge-athletes { background: rgba(0,229,255,0.1); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); }
.badge-adjacent { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.badge-dr { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.badge-sales { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }

.benefit-score {
  font-family: var(--font-head);
  font-size: 2rem;
  font-weight: 800;
  line-height: 1;
}

.benefit-score.high { color: var(--green); }
.benefit-score.mid { color: var(--amber); }
.benefit-score.low { color: var(--red); }

.benefit-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* METRIC BARS */
.metrics {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.metric {
  flex: 1;
}

.metric-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.metric-bar {
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}

.metric-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}

.metric-fill.rev { background: var(--cyan); }
.metric-fill.eff { background: var(--violet); }
.metric-fill.spd { background: var(--green); }

/* EXPANDED CARD / MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(6,10,20,0.92);
  z-index: 1000;
  overflow-y: auto;
  padding: 40px 20px;
  backdrop-filter: blur(4px);
}

.modal-overlay.active { display: flex; justify-content: center; align-items: flex-start; }

.modal-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  max-width: 720px;
  width: 100%;
  padding: 36px;
  position: relative;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}

.modal-close:hover { color: var(--cyan); }

.modal-title {
  font-family: var(--font-head);
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.modal-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.modal-scores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
  padding: 16px;
  background: rgba(0,229,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.modal-score-item {
  text-align: center;
}

.modal-score-item .val {
  font-family: var(--font-head);
  font-size: 1.4rem;
  font-weight: 700;
}

.modal-score-item .lbl {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
}

.plan-section {
  margin-bottom: 20px;
}

.plan-section h3 {
  font-family: var(--font-head);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.plan-section p {
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--text-muted);
}

/* RESPONSIVE */
@media (max-width: 640px) {
  .card-grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; align-items: stretch; }
  .control-group { flex-wrap: wrap; }
  .stats-bar { flex-direction: column; gap: 8px; text-align: center; }
  .modal-content { padding: 24px 18px; }
}
</style>
</head>

<div class="container">

</div>

// STATE
let currentSort = 'benefit';
let currentFilter = 'all';

function getScoreClass(score) {
  if (score >= 8) return 'high';
  if (score >= 5) return 'mid';
  return 'low';
}

function getCategoryLabel(cat) {
  return cat === 'children' ? 'Children/Schools' : cat === 'athletes' ? 'Athletes' : 'Adjacent Markets';
}

function getCategoryBadgeClass(cat) {
  return `badge-${cat}`;
}

function filterIdeas(ideas, filter) {
  if (filter === 'all') return ideas;
  if (filter === 'children') return ideas.filter(i => i.category === 'children');
  if (filter === 'athletes') return ideas.filter(i => i.category === 'athletes');
  if (filter === 'adjacent') return ideas.filter(i => i.category === 'adjacent');
  if (filter === 'sales') return ideas.filter(i => i.sales);
  if (filter === 'nodr') return ideas.filter(i => !i.dr);
  return ideas;
}

function sortIdeas(ideas, sort) {
  const sorted = [...ideas];
  if (sort === 'benefit') sorted.sort((a, b) => b.benefit - a.benefit);
  if (sort === 'revenue') sorted.sort((a, b) => b.rev - a.rev);
  if (sort === 'effort') sorted.sort((a, b) => a.effort - b.effort);
  if (sort === 'speed') sorted.sort((a, b) => b.speed - a.speed);
  return sorted;
}

function updateStats() {
  const launchReady = ideas.filter(i => i.speed >= 7).length;
  const needCode = ideas.filter(i => !i.sales && i.effort >= 3).length;
  const needDr = ideas.filter(i => i.dr).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-item"><span>30</span> strategic opportunities</div>
    <div class="stat-item"><span>${launchReady}</span> launch-ready ideas (speed ≥ 7)</div>
    <div class="stat-item"><span>${needCode}</span> need code development</div>
    <div class="stat-item"><span>${needDr}</span> need clinical review</div>
    <div class="stat-item"><span>${ideas.filter(i => i.sales).length}</span> sales-only launches</div>
  `;
}

function renderCards() {
  const filtered = filterIdeas(ideas, currentFilter);
  const sorted = sortIdeas(filtered, currentSort);
  const grid = document.getElementById('cardGrid');

  grid.innerHTML = sorted.map(idea => `
    <div class="card" onclick="openModal(${idea.id})">
      <div class="card-header">
        <div>
          <div class="card-number">#${idea.id} — Part ${idea.category === 'children' ? '1' : idea.category === 'athletes' ? '2' : '3'}</div>
          <div class="card-title">${idea.title}</div>
        </div>
        <div style="text-align:right">
          <div class="benefit-score ${getScoreClass(idea.benefit)}">${idea.benefit.toFixed(1)}</div>
          <div class="benefit-label">Benefit</div>
        </div>
      </div>
      <div class="card-badges">
        <span class="badge ${getCategoryBadgeClass(idea.category)}">${getCategoryLabel(idea.category)}</span>
        ${idea.dr ? '<span class="badge badge-dr">Dr. Review</span>' : ''}
        ${idea.sales ? '<span class="badge badge-sales">Sales Only</span>' : ''}
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Revenue ${idea.rev}/10</div>
          <div class="metric-bar"><div class="metric-fill rev" style="width:${idea.rev * 10}%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Effort ${idea.effort}/10</div>
          <div class="metric-bar"><div class="metric-fill eff" style="width:${idea.effort * 10}%"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Speed ${idea.speed}/10</div>
          <div class="metric-bar"><div class="metric-fill spd" style="width:${idea.speed * 10}%"></div></div>
        </div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const idea = ideas.find(i => i.id === id);
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');

  content.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="card-number" style="margin-bottom:4px">#${idea.id}</div>
    <div class="modal-title">${idea.title}</div>
    <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:16px">${idea.subtitle}</p>
    <div class="modal-meta">
      <span class="badge ${getCategoryBadgeClass(idea.category)}">${getCategoryLabel(idea.category)}</span>
      ${idea.dr ? '<span class="badge badge-dr">Dr. Review Required</span>' : '<span class="badge badge-sales" style="background:rgba(16,185,129,0.1);color:var(--green);border-color:rgba(16,185,129,0.2)">No Dr. Review</span>'}
      ${idea.sales ? '<span class="badge badge-sales">Sales Only</span>' : ''}
    </div>
    <div class="modal-scores">
      <div class="modal-score-item">
        <div class="val ${getScoreClass(idea.benefit)}">${idea.benefit.toFixed(2)}</div>
        <div class="lbl">Benefit Score</div>
      </div>
      <div class="modal-score-item">
        <div class="val" style="color:var(--cyan)">${idea.rev}</div>
        <div class="lbl">Revenue</div>
      </div>
      <div class="modal-score-item">
        <div class="val" style="color:var(--violet)">${idea.effort}</div>
        <div class="lbl">Effort</div>
      </div>
      <div class="modal-score-item">
        <div class="val" style="color:var(--green)">${idea.speed}</div>
        <div class="lbl">Speed</div>
      </div>
    </div>
    <div class="plan-section"><h3>The Opportunity</h3><p>${idea.plan.opportunity}</p></div>
    <div class="plan-section"><h3>The Science</h3><p>${idea.plan.science}</p></div>
    <div class="plan-section"><h3>The NeuroGaze Angle</h3><p>${idea.plan.angle}</p></div>
    <div class="plan-section"><h3>Honest Limitation</h3><p>${idea.plan.limitation}</p></div>
    <div class="plan-section"><h3>Action Required</h3><p>${idea.plan.action}</p></div>
    <div class="plan-section"><h3>Revenue Model</h3><p>${idea.plan.revenue}</p></div>
    <div class="plan-section"><h3>Timeline</h3><p>${idea.plan.timeline}</p></div>
    <div class="plan-section"><h3>Effort Estimate</h3><p>${idea.plan.effortDesc}</p></div>
    <div class="plan-section"><h3>Dependencies</h3><p>${idea.plan.dependencies}</p></div>
  `;

  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

// Event listeners
document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    renderCards();
  });
});

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });
});

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// Init
updateStats();
renderCards();
</script>
</body>
</html>
